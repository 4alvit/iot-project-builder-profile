name: Validate FCC runner
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: validate-fcc-runner
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, fcc, mp]
    timeout-minutes: 5
    steps:
      - name: Verify runner identity, scratch space and FCC connectivity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = mp-fcc-k3s
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          python3 - <<'PY'
          import hashlib
          import os
          import platform
          import socket
          import tempfile
          import urllib.request
          from pathlib import Path

          assert platform.machine() == "x86_64"
          with tempfile.TemporaryDirectory(prefix="fcc-validate-", dir=os.environ["RUNNER_TEMP"]) as directory:
              path = Path(directory) / "probe"
              data = os.urandom(4096)
              with path.open("wb") as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
              assert hashlib.sha256(path.read_bytes()).digest() == hashlib.sha256(data).digest()
          # Match the FCC service's TCP readiness check without invoking the LLM.
          with socket.create_connection(("fcc.energy-rag.svc.cluster.local", 8082), timeout=10):
              pass
          with urllib.request.urlopen("https://github.com", timeout=15) as response:
              assert response.status == 200
          print("Verified mp/X64 listener, writable scratch, FCC TCP readiness and GitHub HTTPS.")
          PY
