name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.json'
      - '**.yaml'
      - '**.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.json'
      - '**.yaml'
      - '**.yml'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@5b18667880c7a0154b7c7e6686042eff5f47cdb7
    with:
      python-version: '3.11'
      # No tests exist yet; bare pytest exits 5 ('no tests ran') which the
      # workflow treats as failure. Re-enable when the first real test lands.
      run-tests: false
      # Test suite is empty (no tests collected); default 80% coverage gate
      # fails at 0%. Re-enable once real tests exist.
      coverage-threshold: 0
