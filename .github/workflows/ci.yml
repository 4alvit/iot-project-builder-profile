name: CI
permissions:
  contents: read
jobs:
  browsers:
    name: Profile browser acceptance
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@0047a13b5eb79dfa770e31070a83e9696ddd36d1 # main
    permissions:
      contents: read
      actions: read
    with:
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-extended: ${{ inputs.browser-extended || false }}
      browser-prepare-command: python scripts/prepare_browser_checks.py
      browser-test-command: node tests/browser/profile-experience.mjs
      browser-evidence-prefix: profile-experience
  ci:
    name: CI
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.4
      - run: bash scripts/ci.sh
  tls-python311:
    name: TLS policy (Python 3.11)
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.4
      - name: Verify supported minimum Python TLS behavior
        env:
          UV_PYTHON: '3.11'
        run: |
          uv sync --locked --all-extras
          uv run --locked pytest --no-cov tests/test_tls_policy.py tests/test_github_tls.py
'on':
  workflow_call:
    inputs:
      browser-extended:
        description: Include all reviewed browser generations and branded targets
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      browser-extended:
        description: Include all 35 reviewed browser targets instead of the five-target baseline
        type: boolean
        default: true
