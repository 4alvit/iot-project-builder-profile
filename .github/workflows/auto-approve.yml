name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@23d5d855d21bd1f53764de232e80ce07ff1d0757
    with:
      # github-actions[bot] covers the scheduled profile-update PRs from
      # update-profile.yml (BOT_PAT account differs from both authors).
      authors: '["dependabot[bot]","renovate[bot]","4alvit","github-actions[bot]"]'
    # BOT_PAT must be forwarded explicitly (reusable workflows receive
    # no secrets by default). Without the secret the step skips cleanly.
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
