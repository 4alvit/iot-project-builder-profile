name: Update IoT Developer Profile
"on":
  schedule:
  - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to analyze
        required: true
        default: 4alvit
      use-llm:
        description: Enable LLM analysis
        required: false
        default: true
        type: boolean
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  generate-profile:
    runs-on:
    - self-hosted
    - fcc
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        token: ${{ secrets.BOT_PAT }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: 'pip install -e ".[dev]"

        '
    - name: Generate profile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PROFILE_USERNAME: ${{ github.event.inputs.username || '4alvit' }}
        PROFILE_USE_LLM: ${{ github.event.inputs.use-llm || 'true' }}
        ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'http://fcc.energy-rag.svc.cluster.local:8082'
          }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'freecc' }}
      run: |
        EXTRA=()
        if [ "$PROFILE_USE_LLM" = "false" ]; then
          EXTRA+=(--no-llm)
        fi
        # Public repos only (user + orgs); GITHUB_TOKEN is sufficient.
        iot-profile-builder "$PROFILE_USERNAME" \
          --token "$GITHUB_TOKEN" \
          --output ./profile \
          --max-repos 100 \
          --orgs victron-venus,ha-homelab,open-ott-play \
          "${EXTRA[@]}"
    - name: Copy profile to docs
      run: |
        echo "Copying profile artifacts to docs for GitHub Pages"
        mkdir -p docs
        # Copy generated profile files (html/md/json); keep existing docs/pipeline.svg
        cp profile/*_profile.html profile/*_profile.md profile/*_profile.json docs/ 2>/dev/null || {
          # Fallback if naming differs
          for f in profile/*.html profile/*.md profile/*.json; do
            [ -f "$f" ] && cp "$f" docs/
          done
        }
        # Pages entrypoint at site root
        shopt -s nullglob
        html_files=(docs/*_profile.html)
        if [ "${#html_files[@]}" -gt 0 ]; then
          html=${html_files[0]}
          cp "$html" docs/index.html
          echo "Installed Pages entrypoint: docs/index.html <- $html"
        else
          echo "WARNING: no *_profile.html found to install as docs/index.html"
        fi
        ls -la docs/
    - name: Create summary
      run: |
        shopt -s nullglob
        markdown_files=(profile/*_profile.md)
        if [ "${#markdown_files[@]}" -gt 0 ]; then
          markdown_file=${markdown_files[0]}
          echo "Profile generated: $markdown_file"
          {
            echo "## Latest Profile Update"
            echo ""
            head -50 "$markdown_file"
            echo ""
            echo "[View full profile]($markdown_file)"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    # BOT_PAT creates the PR so normal CI events run. Because that account is
    # the PR author, approval needs an independent APPROVAL_PAT or a human review.
    # Never use the author's own token to approve; no credentials are provisioned here.
    - name: Open profile update PR
      env:
        GH_TOKEN: ${{ secrets.BOT_PAT }}
      run: |
        BRANCH="profile-update/$(date +%Y%m%d-%H%M%S)"
        git checkout -b "$BRANCH"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "No profile changes to land"; exit 0
        fi
        git commit -m "chore: update IoT developer profile"
        git push -u origin "$BRANCH"
        gh label create automerge --description "Eligible for automatic merge after checks" --color 0E8A16 --force
        gh pr create \
          --base main --head "$BRANCH" \
          --title "chore: update IoT developer profile" \
          --body "Automated regeneration on the self-hosted fcc runner." \
          --label automerge
