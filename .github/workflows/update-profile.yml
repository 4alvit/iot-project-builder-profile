name: Update IoT Developer Profile
"on":
  schedule:
  - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to analyze
        required: true
        default: 4alvit
      use-llm:
        description: Enable LLM analysis
        required: false
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  generate-profile:
    permissions:
      contents: read
    runs-on:
    - self-hosted
    - fcc
    timeout-minutes: 30
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        token: ${{ secrets.BOT_PAT }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - name: Install locked dependencies
      run: uv sync --locked --all-extras
    - name: Generate profile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PROFILE_USERNAME: ${{ github.event.inputs.username || '4alvit' }}
        PROFILE_USE_LLM: ${{ github.event.inputs.use-llm || 'true' }}
        ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'http://fcc.energy-rag.svc.cluster.local:8082'
          }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'freecc' }}
      run: |
        EXTRA=()
        if [ "$PROFILE_USE_LLM" = "false" ]; then
          EXTRA+=(--no-llm)
        fi
        # Public repos only (user + orgs); GITHUB_TOKEN is sufficient.
        uv run --locked iot-profile-builder "$PROFILE_USERNAME" \
          --token "$GITHUB_TOKEN" \
          --output ./profile \
          --max-repos 100 \
          --orgs victron-venus,ha-homelab,open-ott-play \
          "${EXTRA[@]}"
    - name: Copy profile to docs
      run: |
        echo "Copying profile artifacts to docs for GitHub Pages"
        mkdir -p docs
        # Copy generated profile files (html/md/json); keep existing docs/pipeline.svg
        cp profile/*_profile.html profile/*_profile.md profile/*_profile.json docs/ 2>/dev/null || {
          # Fallback if naming differs
          for f in profile/*.html profile/*.md profile/*.json; do
            [ -f "$f" ] && cp "$f" docs/
          done
        }
        # Pages entrypoint at site root
        shopt -s nullglob
        html_files=(docs/*_profile.html)
        if [ "${#html_files[@]}" -gt 0 ]; then
          html=${html_files[0]}
          cp "$html" docs/index.html
          echo "Installed Pages entrypoint: docs/index.html <- $html"
        else
          echo "WARNING: no *_profile.html found to install as docs/index.html"
        fi
        ls -la docs/
    - name: Create summary
      run: |
        shopt -s nullglob
        markdown_files=(profile/*_profile.md)
        if [ "${#markdown_files[@]}" -gt 0 ]; then
          markdown_file=${markdown_files[0]}
          echo "Profile generated: $markdown_file"
          {
            echo "## Latest Profile Update"
            echo ""
            head -50 "$markdown_file"
            echo ""
            echo "[View full profile]($markdown_file)"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    # BOT_PAT authors the server-signed commit and PR so normal CI events run.
    # Approval uses the independent Actions identity for this same-repository bot.
    - name: Open signed profile update PR
      env:
        GH_TOKEN: ${{ secrets.BOT_PAT }}
      run: python3 -I scripts/publish_profile.py
