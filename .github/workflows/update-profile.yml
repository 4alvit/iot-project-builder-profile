name: Update IoT Developer Profile

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      username:
        description: "GitHub username to analyze"
        required: true
        default: "4alvit"
      use-llm:
        description: "Enable LLM analysis"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.cli ${{ github.event.inputs.username || '4alvit' }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output ./profile \
            --max-repos 100 \
            ${{ github.event.inputs.use-llm != 'false' && '' || '--no-llm' }}

      - name: Create summary
        run: |
          markdown_file=$(find ./profile -name "*_profile.md" | head -1)
          if [ -f "$markdown_file" ]; then
            echo "Profile generated: $markdown_file"
            echo "## Latest Profile Update" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -50 "$markdown_file" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View full profile]($markdown_file)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          git diff --staged --quiet || git commit -m "chore: update IoT developer profile [skip ci]"
          git push