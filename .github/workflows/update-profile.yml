name: Update IoT Developer Profile

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      username:
        description: "GitHub username to analyze"
        required: true
        default: "4alvit"
      use-llm:
        description: "Enable LLM analysis"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  generate-profile:
    # Self-hosted runner on the home-lab arm64 box: only there is the FCC
    # LLM gateway on the NAS (http://synology:8082, mapped via --add-host)
    # reachable. Falls back to heuristic analysis if the gateway is down.
    runs-on: [self-hosted, fcc]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LLM analysis runs through the self-hosted Free Claude Code gateway
          # from the energy-data-rag-pipeline stack (fcc service on the NAS).
          # Both variables are required: the proxy URL and its access password
          # (FCC auth token, default "freecc"). Hosted runners cannot reach the
          # LAN NAS; the generator logs the connection error and falls back to
          # heuristic analysis instead of failing the workflow. Override via
          # repo secrets when a runner with LAN access is attached.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'http://synology:8082' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'freecc' }}
        run: |
          iot-profile-builder ${{ github.event.inputs.username || '4alvit' }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output ./profile \
            --max-repos 100 \
            ${{ github.event.inputs.use-llm != 'false' && '' || '--no-llm' }}

      - name: Create summary
        run: |
          markdown_file=$(find ./profile -name "*_profile.md" | head -1)
          if [ -f "$markdown_file" ]; then
            echo "Profile generated: $markdown_file"
            echo "## Latest Profile Update" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -50 "$markdown_file" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View full profile]($markdown_file)" >> $GITHUB_STEP_SUMMARY
          fi

      # main is protected (PR-only + required signatures + CodeQL gate), so the
      # bot cannot push it directly. Land profile updates through a PR instead:
      # squash-merge commits carry GitHub's web-flow signature, and the repo's
      # auto-approve/auto-merge pipelines close it once checks pass.
      - name: Open profile update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="profile-update/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          if git diff --staged --quiet; then
            echo "No profile changes to land"; exit 0
          fi
          git commit -m "chore: update IoT developer profile [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main --head "$BRANCH" \
            --title "chore: update IoT developer profile" \
            --body "Automated regeneration on the self-hosted fcc runner." \
            --label auto-merge
